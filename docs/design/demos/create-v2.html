const TOOLS = [['text', ICON.text], ['audio', ICON.mic], ['photo', ICON.photo], ['hand', ICON.hand], ['predict', ICON.predict]];
function stepWrite() {
  const hasPredict = S.blocks.some(b => b.type === 'predict');
  const tools = TOOLS.map(([k, ic]) => {
    const off = k === 'predict' && hasPredict;
    const why = off ? t('onePredict') : '';
    return `<button class="tool ${k === 'predict' ? 'predict-tool' : ''}" data-add="${k}" ${off ? 'disabled' : ''} title="${why}">${ic}<span>${t('t_' + k)}</span></button>`;
  }).join('');
  return `<h1>${t(isPub() ? 'pubWriteTitle' : 'writeTitle')}</h1><p class="lede">${t(isPub() ? 'pubWriteLede' : 'writeLede')}</p>
  <div class="sheet-paper" id="paper">${S.blocks.length ? S.blocks.map(blockHtml).join('') : `<div class="empty">${t('empty')}</div>`}</div>
  <div class="tools" role="toolbar">${tools}</div>
  <div class="field"><div class="label">${t('hint')}</div><div class="note">${t('hintSub')}</div><input type="text" id="hint" maxlength="40" placeholder="${t('hintPh')}" value="${esc(S.hint)}"><div class="count" id="hintCount">${S.hint.length} / 40</div></div>`;
}
function blockHtml(b, i) {
  const n = S.blocks.length;
  const head = `<div class="block-head"><span>${t('blockLabel')[b.type]}</span><span class="sp"></span>
    <button class="mini" data-move="${i}" data-dir="-1" aria-label="${t('up')}" ${i === 0 ? 'disabled' : ''}>↑</button>
    <button class="mini" data-move="${i}" data-dir="1" aria-label="${t('down')}" ${i === n - 1 ? 'disabled' : ''}>↓</button>

    render(); return;
  }
  if (d.place) { S.place = PLACES[+d.place]; S.mapOpen = false; render(); return; }
  if (d.landmark) { S.place = LANDMARKS[+d.landmark]; render(); return; }
});
document.addEventListener('input', e => {
  const el = e.target, d = el.dataset;
  if (d.text != null) { S.blocks[+d.text].value = el.value; autosize(); }
  if (d.predict != null) S.blocks[+d.predict].value = el.value;
  if (el.id === 'hint') { S.hint = el.value; $('hintCount').textContent = `${el.value.length} / 40`; }
  if (el.id === 'vq') { S.q = el.value; $('vgrid').innerHTML = vesselGrid(); }
  if (el.id === 'mapq') {
    S.mapQ = el.value; S.mapOpen = true;
    const pos = el.selectionStart; render(); const n = $('mapq'); n.focus(); n.setSelectionRange(pos, pos);
  }
});
document.addEventListener('change', e => {
  const d = e.target.dataset;
  if (d.photo != null) {
    const f = e.target.files[0]; if (!f) return;
    const r = new FileReader(); r.onload = () => { S.blocks[+d.photo].src = r.result; render(); }; r.readAsDataURL(f);
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.sheet) { S.sheet = null; renderSheet(); } });

// Open in a realistic state: one text block already on the page.
S.blocks.push({ id: ++uid, type: 'text', value: '' });
render();
</script>
