<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Corrupted Capsule Dodge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;700&display=swap">
<style>
/* One phone-shaped fight stage in the middle, app chrome around it: header, stage, three big dodge buttons, ball skins. */
:root {
  --paper: #F6F8FB; --card: #FFFFFF; --ink: #16263F; --muted: #5B6B82; --line: #DCE3EC;
  --blue: #2F5D8A; --plum: #6E2B3F; --brass: #C9A15A; --wax: #A3364F;
  --serif: "Noto Serif TC", "Songti TC", Georgia, serif;
  --sans: "Noto Sans TC", "PingFang TC", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --paper: #0F1A2C; --card: #16263F; --ink: #EEF2F7; --muted: #A5B2C4; --line: #2A3B57; --blue: #7FA8D4; color-scheme: dark } }
:root[data-theme="dark"] { --paper: #0F1A2C; --card: #16263F; --ink: #EEF2F7; --muted: #A5B2C4; --line: #2A3B57; --blue: #7FA8D4; color-scheme: dark }
html, body { height: 100%; }
body { background: var(--paper); color: var(--ink); font-family: var(--sans); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 10px; overflow-x: hidden; }
header { width: min(100%, 420px); display: flex; align-items: center; justify-content: space-between; gap: 12px; }
header h1 { font-family: var(--serif); font-size: 18px; font-weight: 700; margin: 0; text-wrap: balance; }
header small { display: block; font-size: 12px; color: var(--muted); font-weight: 400; font-family: var(--sans); }
.lang { font: 500 13px var(--sans); color: var(--blue); background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; cursor: pointer; }
.lang:focus-visible, .ctl:focus-visible, .btn:focus-visible, .skin:focus-visible { outline: 3px solid var(--brass); outline-offset: 2px; }

.stage { position: relative; width: min(100%, 420px, calc((100dvh - 290px) * .6667)); min-width: 240px; aspect-ratio: 2 / 3; max-width: 100%; border-radius: 22px; overflow: hidden; background: #DDEBD3 url(../../../public/art/game/catch-background.webp) center / cover; touch-action: none; user-select: none; -webkit-user-select: none; box-shadow: 0 8px 28px rgba(22,38,63,.18); flex: none; }
.stage img { -webkit-user-drag: none; pointer-events: none; }
.abs { position: absolute; left: 0; top: 0; will-change: transform; }
.dim { position: absolute; inset: 0; background: #16263F; opacity: .12; pointer-events: none; }
.vign { position: absolute; inset: 0; pointer-events: none; opacity: 0; box-shadow: inset 0 0 80px 20px rgba(163,54,79,.85); transition: opacity .12s; }

/* HUD: boss health bar on top, your lives under it */
.hud { position: absolute; left: 10px; right: 10px; top: 10px; display: flex; flex-direction: column; gap: 6px; pointer-events: none; z-index: 20; }
.boss { background: rgba(22,38,63,.82); border-radius: 12px; padding: 7px 10px 8px; color: #F6F8FB; display: flex; flex-direction: column; gap: 5px; }
.boss-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 12px; }
.boss-top b { font: 700 13px var(--serif); }
.boss-top span { font-variant-numeric: tabular-nums; color: #DCE8F2; }
.hp { position: relative; height: 12px; border-radius: 6px; background: #0B1424; overflow: hidden; box-shadow: inset 0 0 0 1.5px #C9A15A; }
.hp i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 6px; }
.hp .lag { background: #F3E2BB; transition: width .5s .25s ease-out; }
.hp .now { background: linear-gradient(#C24A63, #A3364F 55%, #6E2B3F); transition: width .12s ease-out; }
.hp .ticks { position: absolute; inset: 0; background: repeating-linear-gradient(90deg, transparent 0 calc(12.5% - 1px), rgba(11,20,36,.55) calc(12.5% - 1px) 12.5%); }
.lives { align-self: flex-start; display: flex; gap: 4px; padding: 4px 8px; border-radius: 999px; background: rgba(246,248,251,.9); }
.lives img { width: 22px; height: 22px; transition: opacity .2s, filter .2s; }
.lives img.lost { opacity: .25; filter: grayscale(1); }

/* Capsule */
.capsule { width: 36%; aspect-ratio: 1; }
.capsule img { position: absolute; inset: 0; width: 100%; height: 100%; }
.capsule .glow { position: absolute; inset: 8%; border-radius: 50%; background: radial-gradient(circle, rgba(110,43,63,.75), rgba(22,38,63,0) 70%); opacity: 0; transform: scale(1.2); }
.cshadow { width: 30%; height: 4.5%; border-radius: 50%; background: rgba(22,38,63,.16); }

/* Player */
.player { width: 40%; aspect-ratio: 1; transform-origin: 50% 88%; }
.player img { width: 100%; height: 100%; }
.pshadow { width: 17%; height: 3.6%; border-radius: 50%; background: rgba(22,38,63,.2); }

/* Power: the ball gathers above the player's head */
.held { width: 13%; aspect-ratio: 1; }
.held .halo { position: absolute; inset: -55%; border-radius: 50%; background: radial-gradient(circle, rgba(255,236,190,.95) 0%, rgba(201,161,90,.55) 32%, rgba(163,54,79,0) 68%); }
.held .ballimg { position: absolute; inset: 0; width: 100%; height: 100%; }
.held .rim { position: absolute; inset: -22%; overflow: visible; }
.held .rim circle { fill: none; }
.mote { width: 2.2%; aspect-ratio: 1; border-radius: 50%; background: #FFF4D6; box-shadow: 0 0 6px 2px rgba(201,161,90,.9); }
.ready { font: 700 12px var(--sans); color: #fff; background: #A3364F; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }

/* Attacks */
.reticle { width: 26%; aspect-ratio: 2.6; border-radius: 50%; border: 3px dashed #A3364F; background: rgba(163,54,79,.18); box-sizing: border-box; display: grid; place-items: center; }
.reticle b { font: 700 13px var(--sans); color: #fff; background: #A3364F; padding: 2px 8px; border-radius: 999px; transform: translateY(-160%); white-space: nowrap; }
.shard { width: 9%; aspect-ratio: 1; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #8C5B8F, #3B1E3D 45%, #16263F 70%); box-shadow: 0 0 0 2px rgba(22,38,63,.6), 0 0 18px 6px rgba(110,43,63,.55); }
.band { left: 0; width: 100%; height: 11%; display: grid; place-items: center; background: repeating-linear-gradient(135deg, rgba(22,38,63,.22) 0 10px, rgba(22,38,63,.08) 10px 20px); border-block: 2px dashed rgba(22,38,63,.55); }
.band b { font: 700 14px var(--sans); color: #fff; background: #16263F; padding: 3px 12px; border-radius: 999px; }
.wave { border-radius: 50%; border: 6px solid #3B1E3D; box-shadow: 0 0 16px 4px rgba(110,43,63,.55), inset 0 0 12px rgba(110,43,63,.6); box-sizing: border-box; }

/* Thrown ball */
.ball { width: 13%; aspect-ratio: 1; }
.ball img, .ghost img, .fx img { width: 100%; height: 100%; }
.ghost { width: 13%; aspect-ratio: 1; }
.bshadow { width: 9%; height: 2.4%; border-radius: 50%; background: rgba(22,38,63,.22); }
.fx { width: 40%; aspect-ratio: 1; }
.praise { font: 700 30px var(--serif); color: #A3364F; text-shadow: 0 2px 0 #fff, 0 0 12px rgba(255,255,255,.9); white-space: nowrap; }
.dmg { font: 700 18px var(--serif); color: #F6F8FB; text-shadow: 0 1px 0 #6E2B3F, 0 0 6px rgba(110,43,63,.9); font-variant-numeric: tabular-nums; }

/* Overlays */
.overlay { position: absolute; inset: 0; z-index: 30; display: grid; place-items: center; padding: 18px; background: rgba(22,38,63,.38); }
.card { background: #F6F8FB; color: #16263F; border-radius: 18px; padding: 18px; width: 100%; max-width: 330px; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 10px 30px rgba(22,38,63,.3); }
.card h2 { margin: 0; font: 700 20px var(--serif); text-align: center; text-wrap: balance; }
.card p { margin: 0; font-size: 13px; color: #5B6B82; text-align: center; line-height: 1.55; }
.rule { display: grid; grid-template-columns: 52px 1fr; gap: 10px; align-items: center; }
.rule div:last-child { min-width: 0; font-size: 13.5px; line-height: 1.45; }
.rule strong { display: block; font-size: 14px; }
.ico { width: 52px; height: 40px; border-radius: 10px; background: #E7EEF5; display: grid; place-items: center; font: 700 18px var(--sans); }
.ico img { width: 30px; height: 30px; filter: drop-shadow(0 0 6px rgba(201,161,90,.9)); }
.ico.r { color: #A3364F; } .ico.w { color: #16263F; }
.btn { font: 700 16px var(--serif); color: #fff; background: #A3364F; border: 0; border-radius: 999px; padding: 12px 18px; cursor: pointer; }
.result-img { width: 46%; margin: 0 auto; position: relative; aspect-ratio: 1; }
.result-img img { position: absolute; inset: 0; width: 100%; height: 100%; }

/* Controls */
.controls { width: min(100%, 420px); display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
.ctl { height: 56px; border-radius: 16px; border: 1px solid var(--line); background: var(--card); color: var(--blue); font: 700 15px var(--sans); display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; touch-action: manipulation; }
.ctl span { font-size: 22px; line-height: 1; }
.ctl small { font-size: 11px; font-weight: 500; color: var(--muted); }
.ctl.pressed { background: var(--blue); color: #fff; }
.ctl.pressed small { color: #fff; }
.skins { width: min(100%, 420px); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.skins > span { font-size: 12px; color: var(--muted); }
.skin { display: flex; align-items: center; gap: 6px; padding: 4px 10px 4px 4px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); color: var(--ink); font: 500 12px var(--sans); cursor: pointer; }
.skin img { width: 26px; height: 26px; }
.skin[aria-pressed="true"] { border-color: var(--brass); box-shadow: inset 0 0 0 1.5px var(--brass); }
.legend { width: min(100%, 420px); font-size: 12px; color: var(--muted); text-align: center; margin: 0; }
@media (prefers-reduced-motion: reduce) { .vign, .hp i { transition: none; } }
</style>
</head>
<body>


<header>
  <h1 id="tTitle">破損膠囊 · 閃避試玩<small id="tSub">示範：自動投擲，你只管閃</small></h1>
  <button class="lang" id="lang" type="button">EN</button>
</header>

<div class="stage" id="stage" aria-label="Corrupted Capsule fight">
  <div class="dim"></div>
  <div class="hud">
    <div class="boss">
      <div class="boss-top"><b id="tBoss">破損膠囊 · 珍珠奶茶</b><span id="hpText">1000 / 1000</span></div>
      <div class="hp"><i class="lag" id="hpLag" style="width:100%"></i><i class="now" id="hpNow" style="width:100%"></i><div class="ticks"></div></div>
    </div>
    <div class="lives" id="lives" aria-label="lives"></div>
  </div>
  <div class="abs cshadow" id="cshadow"></div>
  <div class="abs capsule" id="capsule">
    <div class="glow" id="cglow"></div>
    <img id="vessel" src="../../../public/art/vessels/vessel-bubble-tea.webp" alt="">
    <img id="crack" src="../../../public/art/game/cracks/bubble-tea.webp" alt="">
  </div>
  <div class="abs band" id="band" hidden><b id="tJump">↑ 往上跳！</b></div>
  <div id="layer"></div>
  <div class="abs pshadow" id="pshadow"></div>
  <div class="abs player" id="player"><img src="../../../public/art/characters/figure-01.webp" alt=""></div>
  <div id="motes"></div>
  <div class="abs held" id="held">
    <div class="halo" id="halo"></div>
    <svg class="rim" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18" stroke="rgba(255,244,214,.35)" stroke-width="2"/><circle id="rimFill" cx="20" cy="20" r="18" stroke="#FFF4D6" stroke-width="2.6" stroke-linecap="round" pathLength="1" stroke-dasharray="0 1" transform="rotate(-90 20 20)"/></svg>
    <img class="ballimg" id="heldImg" src="../../../public/art/game/ball-wax.webp" alt="">
  </div>
  <div class="vign" id="vign"></div>

  <div class="overlay" id="intro">
    <div class="card">
      <h2 id="tIntroH">打敗破損膠囊</h2>
      <div class="rule"><div class="ico"><img src="../../../public/art/game/ball-wax.webp" alt=""></div><div><strong id="tR1h">站著不動 = 自動投擲</strong><span id="tR1">頭上的蠟球會慢慢聚光，亮滿就丟出去。一移動就散掉，要重新聚。</span></div></div>
      <div class="rule"><div class="ico r">← →</div><div><strong id="tR2h">紅色虛線圈 = 左右閃開</strong><span id="tR2">膠囊瞄準你站的那一列，離開那一列。</span></div></div>
      <div class="rule"><div class="ico w">↑</div><div><strong id="tR3h">黑色斜紋帶 = 往上跳</strong><span id="tR3">整排都會被黑浪掃過，跳起來躲。</span></div></div>
      <p id="tKeys">按下面的按鈕、在畫面上滑動，或用鍵盤方向鍵。</p>
      <button class="btn" id="start" type="button">開始</button>
    </div>
  </div>
  <div class="overlay" id="end" hidden>
    <div class="card">
      <div class="result-img"><img id="endVessel" src="../../../public/art/vessels/vessel-bubble-tea.webp" alt=""><img id="endCrack" src="../../../public/art/game/cracks/bubble-tea.webp" alt=""></div>
      <h2 id="endH"></h2>
      <p id="endP"></p>
      <button class="btn" id="again" type="button"></button>
    </div>
  </div>
</div>

<div class="controls">
  <button class="ctl" id="bL" type="button" aria-label="Move left"><span>←</span><small id="tL">左閃</small></button>
  <button class="ctl" id="bU" type="button" aria-label="Jump"><span>↑</span><small id="tU">跳起</small></button>
  <button class="ctl" id="bR" type="button" aria-label="Move right"><span>→</span><small id="tR">右閃</small></button>
</div>
<div class="skins" role="group" aria-label="Ball">
  <span id="tSkin">球的外觀</span>
  <button class="skin" type="button" data-skin="wax" aria-pressed="true"><img src="../../../public/art/game/ball-wax.webp" alt=""><span id="tWax">蠟球</span></button>
  <button class="skin" type="button" data-skin="gold" aria-pressed="false"><img src="../../../public/art/game/ball-gold.webp" alt=""><span id="tGold">金紋球</span></button>
</div>
<p class="legend" id="tLegend">不動就會聚光投擲 · 紅圈：左右閃 · 黑帶：往上跳</p>

<script>
(() => {
  const STR = {
    zh: { title: "破損膠囊 · 閃避試玩", sub: "示範：自動投擲，你只管閃", lang: "EN", boss: "破損膠囊 · 珍珠奶茶",
      jump: "↑ 往上跳！", dodge: "← 閃開 →",
      introH: "打敗破損膠囊", r1h: "站著不動 = 自動投擲", r1: "頭上的蠟球會慢慢聚光，亮滿就丟出去。一移動就散掉，要重新聚。",
      r2h: "紅色虛線圈 = 左右閃開", r2: "膠囊瞄準你站的那一列，離開那一列。",
      r3h: "黑色斜紋帶 = 往上跳", r3: "整排都會被黑浪掃過，跳起來躲。",
      keys: "按下面的按鈕、在畫面上滑動，或用鍵盤方向鍵。", start: "開始",
      L: "左閃", U: "跳起", R: "右閃", skin: "球的外觀", wax: "蠟球", gold: "金紋球",
      legend: "不動就會聚光投擲 · 紅圈：左右閃 · 黑帶：往上跳",
      hit: ["命中！", "很好！", "漂亮！"], ouch: "被打中了",
      winH: "已修復 · 珍珠奶茶", winP: "破損膠囊恢復原樣，加入你的收藏。", loseH: "膠囊逃走了", loseP: "三次被擊中。看到紅圈就換一列，看到黑帶就跳。", again: "再玩一次" },
    en: { title: "Corrupted Capsule · Dodge demo", sub: "Demo: you throw automatically, you just dodge", lang: "中文", boss: "Corrupted Capsule · Bubble tea",
      jump: "↑ Jump!", dodge: "← Move →",
      introH: "Restore the Corrupted Capsule", r1h: "Stand still = auto throw", r1: "The wax ball above your head gathers light. When it is full, you throw it. Moving scatters it and it starts again.",
      r2h: "Red dashed circle = step aside", r2: "The capsule aims at your lane. Leave that lane.",
      r3h: "Dark striped band = jump", r3: "A dark wave sweeps every lane. Jump over it.",
      keys: "Use the buttons below, swipe on the picture, or the arrow keys.", start: "Start",
      L: "Left", U: "Jump", R: "Right", skin: "Ball", wax: "Wax", gold: "Gold vein",
      legend: "Stand still to gather and throw · Red circle: step aside · Dark band: jump",
      hit: ["Hit!", "Good!", "Lovely!"], ouch: "Ouch",
      winH: "Restored · Bubble tea", winP: "The Corrupted Capsule is whole again and joins your collection.", loseH: "The capsule got away", loseP: "You were hit three times. Change lanes on a red circle, jump on a dark band.", again: "Play again" },
  };
  const store = { get(k, d) { try { return localStorage.getItem(k) || d; } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
  let lang = store.get("tc-dodge-lang", "zh");
  let skin = store.get("tc-dodge-skin", "wax");
  const $ = (id) => document.getElementById(id);
  const T = () => STR[lang];
  const ballSrc = () => `../../../public/art/game/ball-${skin}.webp`;
  function applyLang() {
    const s = T();
    document.documentElement.lang = lang === "zh" ? "zh-Hant" : "en";
    $("tTitle").firstChild.nodeValue = s.title; $("tSub").textContent = s.sub; $("lang").textContent = s.lang;
    $("tBoss").textContent = s.boss; $("tJump").textContent = s.jump;
    for (const k of ["introH", "r1h", "r1", "r2h", "r2", "r3h", "r3", "keys", "skin", "wax", "gold", "legend"]) $("t" + k[0].toUpperCase() + k.slice(1)).textContent = s[k];
    $("start").textContent = s.start; $("tL").textContent = s.L; $("tU").textContent = s.U; $("tR").textContent = s.R;
    document.querySelectorAll(".reticle b").forEach((b) => (b.textContent = s.dodge));
    if (!$("end").hidden) showEnd(G.won);
  }
  $("lang").onclick = () => { lang = lang === "zh" ? "en" : "zh"; store.set("tc-dodge-lang", lang); applyLang(); };
  function applySkin() {
    document.querySelectorAll(".skin").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.skin === skin)));
    $("heldImg").src = ballSrc();
  }
  document.querySelectorAll(".skin").forEach((b) => (b.onclick = () => { skin = b.dataset.skin; store.set("tc-dodge-skin", skin); applySkin(); }));

  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const stage = $("stage"), layer = $("layer");
  const LANES = [.2, .5, .8], GROUND = .865, CAP_Y = .31;
  const HP = 1000, DMG = 125, LIVES = 3, CHARGE = .95, JUMP = .7, MOVE = .13, FLIGHT = .62, WIND = .14;
  const rand = (a, b) => a + Math.random() * (b - a);
  const lerp = (a, b, t) => a + (b - a) * t;
  const place = (el, x, y, extra = "") => { el.style.transform = `translate(${x}px, ${y}px) translate(-50%, -50%) ${extra}`; };

  // Light motes that drift in toward the ball while it gathers power.
  const MOTES = 6, motes = [];
  for (let i = 0; i < MOTES; i++) { const m = document.createElement("div"); m.className = "abs mote"; $("motes").appendChild(m); motes.push({ el: m, a: (i / MOTES) * Math.PI * 2, off: i / MOTES }); }

  let G;
  function reset() {
    layer.innerHTML = "";
    G = { t: 0, lane: 1, x: LANES[1], fromX: LANES[1], moveT: 1, jumpT: -1, charge: 0, windT: -1, hp: HP, lives: LIVES, hurtT: -9, throwT: -9,
      balls: [], attacks: [], fx: [], nextAttack: 1.8, running: false, won: false, shakeT: -9, scatter: 0 };
    $("band").hidden = true; drawHud();
  }
  function drawHud() {
    $("lives").innerHTML = Array.from({ length: LIVES }, (_, i) => `<img src="../../../public/art/seal-wax.webp" alt="" class="${i < G.lives ? "" : "lost"}">`).join("");
    const p = G.hp / HP;
    $("hpNow").style.width = p * 100 + "%"; $("hpLag").style.width = p * 100 + "%";
    $("hpText").textContent = `${G.hp} / ${HP}`;
    $("crack").style.opacity = String(.15 + p * .85);
    $("vessel").style.filter = `saturate(${lerp(1, .55, p)}) brightness(${lerp(1, .8, p)})`;
  }

  // Input
  const airborne = () => G.jumpT >= 0;
  function interrupt() { if (G.charge > .15) G.scatter = 1; G.charge = 0; G.windT = -1; }
  function move(d) {
    if (!G.running) return;
    const lane = Math.max(0, Math.min(2, G.lane + d));
    if (lane === G.lane) return;
    G.fromX = G.x; G.lane = lane; G.moveT = 0; interrupt();
  }
  function jump() { if (!G.running || airborne()) return; G.jumpT = 0; interrupt(); }
  function flash(id) { const b = $(id); b.classList.add("pressed"); setTimeout(() => b.classList.remove("pressed"), 140); }
  $("bL").addEventListener("pointerdown", (e) => { e.preventDefault(); move(-1); flash("bL"); });
  $("bR").addEventListener("pointerdown", (e) => { e.preventDefault(); move(1); flash("bR"); });
  $("bU").addEventListener("pointerdown", (e) => { e.preventDefault(); jump(); flash("bU"); });
  addEventListener("keydown", (e) => {
    if (e.target.closest && e.target.closest("button") && (e.key === " " || e.key === "Enter")) return;
    const k = e.key.toLowerCase();
    if (k === "arrowleft" || k === "a") { move(-1); flash("bL"); }
    else if (k === "arrowright" || k === "d") { move(1); flash("bR"); }
    else if (k === "arrowup" || k === "w" || k === " ") { jump(); flash("bU"); }
    else return;
    e.preventDefault();
  });
  let sw = null;
  stage.addEventListener("pointerdown", (e) => { sw = { x: e.clientX, y: e.clientY }; });
  stage.addEventListener("pointerup", (e) => {
    if (!sw) return; const dx = e.clientX - sw.x, dy = e.clientY - sw.y; sw = null;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
    if (Math.abs(dx) > Math.abs(dy)) move(dx > 0 ? 1 : -1); else if (dy < 0) jump();
  });

  // Spawning
  function el(cls, html = "") { const d = document.createElement("div"); d.className = "abs " + cls; d.innerHTML = html; layer.appendChild(d); return d; }
  function throwBall() {
    const ghosts = reduce ? [] : [0, 1, 2, 3].map((i) => { const g = el("ghost", `<img src="${ballSrc()}" alt="">`); g.style.opacity = String(.32 - i * .07); return g; });
    G.balls.push({ t: 0, x: G.x, el: el("ball", `<img src="${ballSrc()}" alt="">`), sh: el("bshadow"), ghosts, hist: [] });
    G.throwT = G.t;
  }
  function attack() {
    const tough = 1 - G.hp / HP;
    const r = Math.random();
    const warn = lerp(.85, .62, tough);
    if (r < .27) {
      G.attacks.push({ kind: "wave", t: 0, warn, fly: .62, el: null });
    } else {
      const lanes = tough >= .25 && r > .78 ? [0, 1, 2].filter((l) => l !== Math.floor(Math.random() * 3)) : [G.lane];
      for (const lane of lanes) G.attacks.push({ kind: "shot", lane, t: 0, warn, fly: lerp(.7, .55, tough), el: null, ret: el("reticle", `<b>${T().dodge}</b>`) });
    }
    G.nextAttack = G.t + warn + rand(1.25, 2.1) - tough * .5;
  }
  function popFx(src, x, y, size, life) { const d = el("fx", `<img src="${src}" alt="">`); d.style.width = size * 100 + "%"; G.fx.push({ el: d, x, y, t: 0, life, kind: "img" }); }
  function floatText(cls, text, x, y, life, color) { const d = el(cls); d.textContent = text; if (color) d.style.color = color; G.fx.push({ el: d, x, y, t: 0, life, kind: "text" }); }

  function hurt() {
    if (G.t - G.hurtT < 1) return;
    G.hurtT = G.t; G.lives--; drawHud(); interrupt();
    floatText("praise", T().ouch, G.x, GROUND - .3, .8, "#16263F");
    $("vign").style.opacity = "1"; setTimeout(() => ($("vign").style.opacity = "0"), 220);
    if (G.lives <= 0) finish(false);
  }
  function landHit() {
    G.hp = Math.max(0, G.hp - DMG); G.shakeT = G.t; drawHud();
    popFx("../../../public/art/game/hit-dust.webp", .5, CAP_Y, .32, .5);
    floatText("dmg", `-${DMG}`, .5 + rand(-.08, .08), CAP_Y - .06, .7);
    if (Math.random() < .5) { const w = T().hit; floatText("praise", w[Math.floor(Math.random() * w.length)], .5, CAP_Y - .15, .8); }
    if (G.hp <= 0) { popFx("../../../public/art/fx/fx-light-burst.webp", .5, CAP_Y, .8, 1.2); finish(true); }
  }
  function finish(won) {
    G.running = false; G.won = won; G.charge = 0;
    for (const a of G.attacks) { a.el?.remove(); a.ret?.remove(); }
    G.attacks = []; $("band").hidden = true;
    setTimeout(() => showEnd(won), won ? 1000 : 500);
  }
  function showEnd(won) {
    const s = T();
    $("endH").textContent = won ? s.winH : s.loseH; $("endP").textContent = won ? s.winP : s.loseP; $("again").textContent = s.again;
    $("endCrack").style.opacity = won ? "0" : "1";
    $("endVessel").style.filter = won ? "none" : "saturate(.55) brightness(.8)";
    $("end").hidden = false;
  }
  $("start").onclick = () => { $("intro").hidden = true; reset(); G.running = true; };
  $("again").onclick = () => { $("end").hidden = true; reset(); G.running = true; };

  // Loop
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    if (G.running) update(dt);
    render(stage.clientWidth, stage.clientHeight, dt);
    requestAnimationFrame(frame);
  }
  function update(dt) {
    G.t += dt;
    if (G.moveT < 1) G.moveT = Math.min(1, G.moveT + dt / MOVE);
    G.x = lerp(G.fromX, LANES[G.lane], 1 - Math.pow(1 - G.moveT, 3));
    if (airborne()) { G.jumpT += dt; if (G.jumpT >= JUMP) G.jumpT = -1; }
    G.scatter = Math.max(0, G.scatter - dt * 4);
    const still = G.moveT >= 1 && !airborne();
    if (G.windT >= 0) { G.windT += dt; if (G.windT >= WIND) { G.windT = -1; G.charge = 0; throwBall(); } }
    else if (still) { G.charge += dt; if (G.charge >= CHARGE) { G.charge = CHARGE; G.windT = 0; } }
    if (G.t >= G.nextAttack) attack();

    for (const b of G.balls) { b.t += dt / FLIGHT; if (b.t >= 1 && !b.done) { b.done = true; b.el.remove(); b.sh.remove(); b.ghosts.forEach((g) => g.remove()); if (G.running) landHit(); } }
    G.balls = G.balls.filter((b) => !b.done);

    for (const a of G.attacks) {
      a.t += dt;
      if (a.t >= a.warn && !a.el) a.el = el(a.kind === "shot" ? "shard" : "wave");
      if (a.t >= a.warn + a.fly && !a.done) {
        a.done = true;
        if (a.kind === "shot") { if (Math.abs(G.x - LANES[a.lane]) < .14) hurt(); }
        else if (!airborne() || G.jumpT > JUMP - .06) hurt();
      }
    }
    for (const a of G.attacks.filter((a) => a.done)) { a.el?.remove(); a.ret?.remove(); }
    G.attacks = G.attacks.filter((a) => !a.done);
    $("band").hidden = !G.attacks.some((a) => a.kind === "wave");

    for (const f of G.fx) { f.t += dt; if (f.t >= f.life) f.el.remove(); }
    G.fx = G.fx.filter((f) => f.t < f.life);
  }

  function render(W, H) {
    const t = G.t;
    const warning = G.attacks.some((a) => a.t < a.warn);
    // Capsule
    let cx = .5 * W, cy = CAP_Y * H + (reduce ? 0 : Math.sin(t * 2.2) * H * .008);
    if (!reduce && t - G.shakeT < .25) { cx += rand(-1, 1) * W * .015; cy += rand(-1, 1) * W * .01; }
    $("cglow").style.opacity = String(warning ? .55 + .45 * Math.sin(t * 18) : 0);
    place($("capsule"), cx, cy, warning && !reduce ? `scale(${1 + .03 * Math.sin(t * 18)})` : "");
    place($("cshadow"), .5 * W, (CAP_Y + .125) * H);

    // Player: a slight crouch while gathering, a snap forward on release.
    const jumpOff = airborne() ? Math.sin(Math.PI * G.jumpT / JUMP) * H * .17 : 0;
    const feetY = GROUND * H, px = G.x * W, pw = .40 * W;
    const p = G.charge / CHARGE;
    const since = t - G.throwT;
    let sx = 1, sy = 1;
    if (!reduce) {
      if (G.windT >= 0) { sy = .94; sx = 1.04; }
      else if (since < .18) { const k = since / .18; sy = lerp(1.07, 1, k); sx = lerp(.96, 1, k); }
      else { sy = 1 - p * .03; sx = 1 + p * .015; }
      if (G.moveT < 1) sx *= 1 + Math.sin(G.moveT * Math.PI) * .06;
    }
    const pEl = $("player");
    place(pEl, px, feetY - pw * .38 - jumpOff, `scale(${sx}, ${sy})`);
    pEl.style.opacity = t - G.hurtT < 1 ? (Math.floor(t * 14) % 2 ? ".35" : "1") : "1";
    place($("pshadow"), px, feetY, `scale(${1 - (jumpOff / (H * .17)) * .45})`);

    // Gathering ball above the head: grows, brightens, ring fills, motes drift in, pulses faster near full.
    const hx = px, hy = feetY - pw * .86 - jumpOff + (G.windT >= 0 ? -pw * .04 : 0);
    const held = $("held");
    const showHeld = G.running && (p > 0 || G.windT >= 0);
    const ease = 1 - Math.pow(1 - p, 2);
    const beat = reduce ? 0 : Math.sin(t * lerp(6, 22, p)) * .05 * p;
    held.style.opacity = showHeld ? String(Math.min(1, p * 4)) : String(G.scatter);
    place(held, hx, hy, `scale(${showHeld ? lerp(.35, 1, ease) + beat : 1 + (1 - G.scatter) * .6}) rotate(${reduce ? 0 : t * 90}deg)`);
    $("halo").style.opacity = String(showHeld ? .15 + ease * .85 : 0);
    $("rimFill").setAttribute("stroke-dasharray", `${p.toFixed(3)} 1`);
    for (const m of motes) {
      const k = (t * 1.6 + m.off) % 1;
      const r = lerp(.2, .02, k) * W, a = m.a + t * 1.4;
      place(m.el, hx + Math.cos(a) * r, hy + Math.sin(a) * r * .9, `scale(${lerp(.5, 1.1, k)})`);
      m.el.style.opacity = showHeld && G.windT < 0 && !reduce ? String(Math.sin(k * Math.PI) * Math.min(1, p * 2)) : "0";
    }

    // Thrown balls: arc from above the head into the capsule, spinning, shrinking with distance,
    // a ground shadow underneath and a short fading trail.
    for (const b of G.balls) {
      const k = Math.min(1, b.t);
      const startX = b.x * W, startY = feetY - pw * .86;
      const x = lerp(startX, cx, k), y = lerp(startY, cy, k) - Math.sin(Math.PI * k) * H * .16;
      const s = lerp(1, .42, Math.pow(k, .8)) * (k > .92 ? lerp(1, .8, (k - .92) / .08) : 1);
      place(b.el, x, y, `scale(${s}) rotate(${reduce ? 0 : k * 720}deg)`);
      b.hist.unshift([x, y, s]); b.hist.length = Math.min(b.hist.length, 13);
      b.ghosts.forEach((g, i) => { const h = b.hist[Math.min(b.hist.length - 1, (i + 1) * 3)]; place(g, h[0], h[1], `scale(${h[2] * (1 - i * .1)})`); });
      const gy = lerp(feetY, (CAP_Y + .125) * H, k);
      place(b.sh, x, gy, `scale(${lerp(1, .45, k)})`);
      b.sh.style.opacity = String(lerp(.9, .4, k));
    }
    // Attacks
    const band = $("band");
    band.style.transform = `translate(0, ${feetY}px) translateY(-50%)`;
    band.style.opacity = String(.75 + .25 * Math.sin(t * 16));
    for (const a of G.attacks) {
      if (a.kind === "shot") {
        const lx = LANES[a.lane] * W;
        place(a.ret, lx, feetY, reduce ? "" : `scale(${1 + .08 * Math.sin(t * 16)})`);
        a.ret.style.opacity = a.t < a.warn ? "1" : ".7";
        if (a.el) {
          const k = Math.min(1, (a.t - a.warn) / a.fly);
          const x = lerp(cx, lx, k), y = lerp(cy, feetY - pw * .35, k) - Math.sin(Math.PI * k) * H * .06;
          place(a.el, x, y, `scale(${lerp(.6, 1.9, k * k)})`);
        }
      } else if (a.el) {
        const k = Math.min(1, (a.t - a.warn) / a.fly);
        const y = lerp((CAP_Y + .12) * H, feetY, k), w = lerp(.3, 1.4, k) * W;
        a.el.style.width = w + "px"; a.el.style.height = w * .22 + "px";
        place(a.el, .5 * W, y);
        a.el.style.opacity = String(Math.min(1, k * 3));
      }
    }
    for (const f of G.fx) {
      const k = f.t / f.life;
      if (f.kind === "text") { place(f.el, f.x * W, f.y * H - k * H * .06, `scale(${k < .15 ? .6 + k * 2.7 : 1})`); f.el.style.opacity = String(k > .7 ? (1 - k) / .3 : 1); }
      else { place(f.el, f.x * W, f.y * H, `scale(${.7 + k * .6})`); f.el.style.opacity = String(1 - k); }
    }
  }

  document.addEventListener("visibilitychange", () => { last = performance.now(); });
  reset(); applyLang(); applySkin(); requestAnimationFrame(frame);
})();
</script>

</body>
</html>
